name: CI - Integracao Continua (Develop)

# Dispara em commits ou Pull Requests para a branch develop
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  validacao-estatica:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Validar integridade dos arquivos
        run: |
          echo "Verificando estrutura do projeto estático..."
          ls -la
          echo "Validação concluída com sucesso!"