name: CI - Integracao Continua (Develop)

# Dispara em commits ou Pull Requests para a branch develop
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Executar validacoes / linter
        run: npm run lint --if-present

      - name: Executar testes automatizados
        run: npm test --if-present