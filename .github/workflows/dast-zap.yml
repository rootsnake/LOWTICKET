name: DAST - Análise Dinâmica (OWASP ZAP)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  zap_scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    
    # Permissões completas para o ZAP poder interagir com o repositório sem falhas de integração
    permissions:
      security-events: write
      actions: read
      contents: read
      issues: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://rootsnake.github.io/LOWTICKET/'
          fail_action: false
          cmd_options: '-a'