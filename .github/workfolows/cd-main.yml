name: CD - Implantacao Continua (Main)

# Dispara apenas quando o codigo entra na branch main
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Build de Producao
        run: npm run build --if-present

      # Exemplo de etapa de Deploy (ex: Fly.io, Vercel, Docker Hub, etc.)
      - name: Deploy para Producao
        run: echo "Aqui entra o comando automatizado de deploy do seu provedor de hospedagem"